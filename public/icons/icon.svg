<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#fdfbf9"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#f7efe9" stroke="#171717" stroke-width="12"/>
  
  <!-- Outer Circular Dial with Tick Marks -->
  <circle cx="256" cy="256" r="160" fill="#fdfbf9" stroke="#171717" stroke-width="10"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="#ff6f1e" stroke-width="4" stroke-dasharray="6,8"/>
  
  <!-- Compass Needle (North / South Surveyor Precision) -->
  <polygon points="256,120 286,256 256,236 226,256" fill="#ff6f1e" stroke="#171717" stroke-width="6"/>
  <polygon points="256,392 286,256 256,276 226,256" fill="#171717" stroke="#171717" stroke-width="6"/>
  
  <!-- Central Hub -->
  <circle cx="256" cy="256" r="26" fill="#fdfbf9" stroke="#171717" stroke-width="8"/>
  <circle cx="256" cy="256" r="10" fill="#ff6f1e"/>

  <!-- Compass Cardinal Letters (Surveying) -->
  <text x="256" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#ce500a">N</text>
  <text x="256" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="#171717">S</text>
  <text x="410" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="#171717">E</text>
  <text x="102" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="#171717">W</text>
</svg>